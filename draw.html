<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo Prize Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #1c1340;
  --bg-2: #2a1d5c;
  --ink: #ffffff;
  --soft: #c9c1f0;
  --tile: rgba(255, 255, 255, 0.08);
  --tile-line: rgba(255, 255, 255, 0.16);
  --c1: #ff5c7a;
  --c2: #ffc93c;
  --c3: #2ee6c5;
  --c4: #7aa7ff;
  --c5: #c38bff;
  --c6: #ff9a4d;
  --dark: #1c1340;
  --fun: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: radial-gradient(120% 60% at 50% -10%, var(--bg-2), var(--bg) 70%); overflow-x: hidden; }
.sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.sky i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px; opacity: 0.5; animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
main { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 28px 16px 40px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--tile); border: 1.5px solid var(--tile-line); border-radius: 22px; padding: 24px; display: grid; gap: 14px; align-content: start; }
.left { text-align: center; }
.tag { justify-self: center; font: 600 0.8rem/1 var(--fun); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dark); background: var(--c2); padding: 7px 14px; border-radius: 99px; animation: wobble 3s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
h1 { margin: 0; font: 700 clamp(3rem, 7vw, 4.6rem)/1 var(--fun); }
h1 span { display: inline-block; animation: bounce 2.4s ease-in-out infinite; }
h1 span:nth-child(1) { color: var(--c1); }
h1 span:nth-child(2) { color: var(--c2); animation-delay: 0.12s; }
h1 span:nth-child(3) { color: var(--c3); animation-delay: 0.24s; }
h1 span:nth-child(4) { color: var(--c4); animation-delay: 0.36s; }
h1 span:nth-child(5) { color: var(--c5); animation-delay: 0.48s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }
.scan { margin: 0; font: 600 1.3rem/1.3 var(--fun); color: var(--soft); }
#qr { justify-self: center; padding: 16px; background: #fff; border-radius: 18px; box-shadow: 0 0 0 6px var(--c1), 0 0 0 12px var(--c2), 0 20px 40px rgba(0,0,0,0.4); }
#qr img, #qr canvas { display: block; width: min(360px, 70vw) !important; height: auto !important; }
.url { font-size: 0.9rem; color: var(--soft); word-break: break-all; }
h2 { margin: 0; font: 700 1.5rem/1.1 var(--fun); }
.winner { min-height: 3.4em; display: flex; align-items: center; justify-content: center; text-align: center; font: 700 clamp(2.2rem, 5vw, 3.4rem)/1.1 var(--fun); border: 3px dashed var(--tile-line); border-radius: 18px; padding: 16px; color: var(--soft); transition: all 0.3s; }
.winner.spin { color: var(--ink); border-color: var(--c4); }
.winner.won { border: 3px solid var(--c2); color: var(--dark); background: var(--c2); animation: winpop 0.7s cubic-bezier(.3,1.8,.5,1); box-shadow: 0 0 40px rgba(255, 201, 60, 0.5); }
@keyframes winpop { 0% { transform: scale(0.6) rotate(-4deg); } 60% { transform: scale(1.08) rotate(2deg); } 100% { transform: scale(1); } }
.btn { font: 700 1.3rem/1 var(--fun); padding: 18px; border: 0; border-radius: 16px; color: #fff; cursor: pointer; background: linear-gradient(90deg, var(--c1), var(--c6)); box-shadow: 0 6px 0 #c23656; transition: transform 0.1s, box-shadow 0.1s; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c23656; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn:focus-visible { outline: 3px solid var(--c2); outline-offset: 3px; }
.count { color: var(--c2); font-variant-numeric: tabular-nums; }
ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
li { padding: 6px 12px; border-radius: 99px; background: var(--tile); border: 1px solid var(--tile-line); font: 600 0.95rem/1.2 var(--fun); animation: join 0.5s cubic-bezier(.3,1.6,.5,1) backwards; }
li.won { background: var(--c2); color: var(--dark); border-color: var(--c2); }
@keyframes join { from { opacity: 0; transform: scale(0.3); } }
.status { color: var(--soft); margin: 0; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .sky { display: none; } }
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<main>
  <section class="panel left">
    <span class="tag">End of Year 2026</span>
    <h1><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></h1>
    <p class="scan">Scan to play. Tick off all 16 to win a spot in the prize draw!</p>
    <div id="qr"></div>
    <div class="url" id="url"></div>
  </section>

  <section class="panel">
    <h2>Prize draw</h2>
    <div class="winner" id="winner">Who will it be?</div>
    <button class="btn" id="draw" type="button" disabled>Draw a winner</button>
    <h2><span class="count" id="count">0</span> in the draw</h2>
    <ul id="list"></ul>
    <p class="status" id="status"></p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const DB = "https://unsw-team-calendar-default-rtdb.asia-southeast1.firebasedatabase.app/eoy_bingo/entries.json";
const playUrl = location.href.replace(/draw\.html.*$/, "").replace(/[?#].*$/, "");
document.getElementById("url").textContent = playUrl;
new QRCode(document.getElementById("qr"), { text: playUrl, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });

const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const palette = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map(c => getComputedStyle(document.documentElement).getPropertyValue(c).trim());

let names = [];
const shown = new Set();
const winners = new Set();
let spinning = false;

async function refresh() {
  try {
    const r = await fetch(DB + "?t=" + Date.now());
    const data = (await r.json()) || {};
    const seen = new Map();
    Object.values(data).sort((a, b) => (a.at || 0) - (b.at || 0)).forEach(e => {
      const n = String(e.name || "").trim();
      if (n && !seen.has(n.toLowerCase())) seen.set(n.toLowerCase(), n);
    });
    names = [...seen.values()];
    document.getElementById("status").textContent = "";
  } catch (x) {
    document.getElementById("status").textContent = "Can't reach the entries right now. Retrying...";
  }
  renderList();
}

function renderList() {
  document.getElementById("count").textContent = names.length;
  const ul = document.getElementById("list");
  ul.replaceChildren(...names.map(n => {
    const li = document.createElement("li");
    li.textContent = n;
    if (shown.has(n)) li.style.animation = "none";
    if (winners.has(n)) li.className = "won";
    return li;
  }));
  names.forEach(n => shown.add(n));
  const left = names.filter(n => !winners.has(n));
  document.getElementById("draw").disabled = spinning || left.length === 0;
}

document.getElementById("draw").addEventListener("click", () => {
  const pool = names.filter(n => !winners.has(n));
  if (!pool.length) return;
  spinning = true;
  renderList();
  const box = document.getElementById("winner");
  box.classList.remove("won");
  box.classList.add("spin");
  const pick = pool[Math.floor(Math.random() * pool.length)];
  let ticks = calm ? 0 : 32, delay = 45;
  (function spin() {
    if (ticks-- > 0) {
      box.textContent = pool[Math.floor(Math.random() * pool.length)];
      delay *= 1.08;
      setTimeout(spin, delay);
      return;
    }
    box.textContent = pick;
    box.classList.remove("spin");
    box.classList.add("won");
    winners.add(pick);
    spinning = false;
    document.getElementById("draw").textContent = "Draw again";
    renderList();
    const r = box.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 160, 13);
    setTimeout(() => { burst(innerWidth * 0.15, innerHeight * 0.4, 100, 11); burst(innerWidth * 0.85, innerHeight * 0.4, 100, 11); }, 250);
  })();
});

const cv = document.getElementById("confetti");
const ctx = cv.getContext("2d");
const bits = [];
let running = false;
function size() { const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", size);
size();
function burst(x, y, n, power) {
  if (calm) return;
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, s = power * (0.4 + Math.random());
    bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - power * 0.6, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: palette[k % palette.length], life: 90 + Math.random() * 60 });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (let k = bits.length - 1; k >= 0; k--) {
    const p = bits[k];
    p.vy += 0.22; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    if (p.life <= 0 || p.y > innerHeight + 20) { bits.splice(k, 1); continue; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.globalAlpha = Math.min(1, p.life / 25);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  if (bits.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

const sky = document.getElementById("sky");
for (let k = 0; k < 18; k++) {
  const i = document.createElement("i");
  i.style.left = (Math.random() * 100) + "%";
  i.style.background = palette[k % palette.length];
  i.style.animationDuration = (10 + Math.random() * 10) + "s";
  i.style.animationDelay = (-Math.random() * 20) + "s";
  sky.appendChild(i);
}

refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
